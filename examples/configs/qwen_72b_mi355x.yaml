# Qwen 2.5 72B on AMD Instinct MI355X (288 GB HBM3E, 3 TB host RAM)
# Full-precision fine-tuning of a 72B model on a single GPU.
# Requires ~864 GB host RAM for FP32 master weights + Adam states.

model:
  name: "Qwen/Qwen2.5-72B-Instruct"
  dtype: "bfloat16"
  device: 0
  trust_remote_code: true

dataset:
  name: "metamath"
  dataset_dir: "data"
  max_seq_len: 1024
  num_workers: 2
  train_ratio: 0.7
  eval_ratio: 0.3
  split_seed: 42

training:
  batch_size: 200
  gradient_accumulation_steps: 1
  num_steps: 100
  learning_rate: 5.0e-6
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

optimizer:
  type: "deepspeed_adam"
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

memory:
  checkpoint_interval: 4
  num_grad_slabs: 12

logging:
  log_interval: 1
  enable_timing: true

evaluation:
  enabled: false
